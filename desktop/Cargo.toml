[package]
name = "yabosen-controller"
version = "1.0.0"
edition = "2024"
description = "Desktop controller for the live status on yabosen.live"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
discord-rich-presence = "1.1"
rfd = "0.17"
base64 = "0.23"
directories = "6"
auto-launch = "0.6"
chrono = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tray-icon = "0.26"

[profile.release]
lto = "thin"
strip = true
