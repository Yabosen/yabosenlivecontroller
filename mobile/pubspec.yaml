name: yabosen_controller
description: "Remote control for the live status on yabosen.live (Android)."
publish_to: 'none'

# build-name -> versionName, build-number -> versionCode on Android.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_foreground_task: ^11.0.3
  http: ^1.6.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
